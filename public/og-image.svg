<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="0.55" stop-color="#0d0a08"/>
      <stop offset="1" stop-color="#170909"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c547"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b1212"/>
      <stop offset="1" stop-color="#3d0808"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c41e1e" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c41e1e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint chassis grid -->
  <g opacity="0.08" stroke="#c9a227" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="700" y1="80" x2="700" y2="560"/>
  </g>

  <!-- top header strip (matches site masthead) -->
  <rect x="0" y="0" width="1200" height="14" fill="url(#header)"/>

  <!-- hero: red star with soft glow (favicon motif, scaled) -->
  <circle cx="980" cy="260" r="200" fill="url(#starGlow)"/>
  <g transform="translate(850,120) scale(4)">
    <rect x="-8" y="-8" width="80" height="80" rx="12" fill="#5c0a0a"/>
    <polygon points="32,8 38,28 58,28 42,40 48,58 32,46 16,58 22,40 6,28 26,28" fill="#c41e1e" stroke="#c9a227" stroke-width="1.5"/>
  </g>

  <!-- tuning dial with needle (site motif) -->
  <g>
    <rect x="780" y="468" width="380" height="76" rx="10" fill="#0a120c" stroke="#8a7020" stroke-width="3"/>
    <g stroke="#33ff66" stroke-opacity="0.35" stroke-width="1">
      <line x1="806" y1="480" x2="806" y2="498"/>
      <line x1="858" y1="480" x2="858" y2="498"/>
      <line x1="910" y1="480" x2="910" y2="498"/>
      <line x1="962" y1="480" x2="962" y2="498"/>
      <line x1="1014" y1="480" x2="1014" y2="498"/>
      <line x1="1066" y1="480" x2="1066" y2="498"/>
      <line x1="1118" y1="480" x2="1118" y2="498"/>
    </g>
    <line x1="950" y1="476" x2="950" y2="536" stroke="#ff4444" stroke-width="4"/>
    <text x="1136" y="526" font-family="DejaVu Sans Mono, monospace" font-size="26" letter-spacing="3" fill="#33ff66" text-anchor="end">88.1 МГц</text>
    <text x="800" y="526" font-family="DejaVu Sans Mono, monospace" font-size="15" letter-spacing="3" fill="#c9a227">УКВ</text>
  </g>

  <!-- wordmark (left block, clears the emblem at x=818) -->
  <text x="80" y="265" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="96" font-weight="bold" fill="url(#gold)">РАДИО ВОЛНА</text>
  <text x="84" y="330" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="32" fill="#e8dcc8">Soviet-styled web radio — 8 FM stations</text>
  <rect x="84" y="362" width="120" height="8" fill="#c41e1e"/>
  <text x="84" y="424" font-family="DejaVu Sans Mono, monospace" font-size="22" letter-spacing="2" fill="#c9a227">VU METER · FAVOURITES · УКВ ПРИЁМНИК · 1974</text>
  <text x="84" y="560" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#e8dcc8" opacity="0.5">billyx86.github.io/radio-volna-soviet</text>
</svg>
